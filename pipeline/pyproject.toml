[tool.uv]
package = false

[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tomi", email = "tomi.nagy@adathuszar.hu" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "psycopg2>=2.9.13",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.0.54",
    "tdqm>=0.0.1",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.7.1",
]

